<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Treadmill</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Title above deck with dashed underline -->
    <header class="app-title">
      <h1>treadmill</h1>
    </header>

    <main class="layout">
      <section class="deck">
        <header class="deck-header">
          <div class="status-pill">
            <span id="status-pill-pulse" class="disconnected"></span>
            <span id="status-pill"></span>
          </div>
        </header>

        <!-- Speed Control Dial -->
        <section class="speed-module">
          <div class="speed-dial">
            <button id="minus" class="key-btn" aria-label="Decrease speed">
              <i class="ph-bold ph-minus"></i>
            </button>

            <div class="lcd-screen">
              <span id="speed" class="speed-val"></span>
              <span class="unit">KM/H</span>
            </div>

            <button id="plus" class="key-btn" aria-label="Increase speed">
              <i class="ph-bold ph-plus"></i>
            </button>
          </div>
        </section>

        <!-- Telemetry Grid -->
        <section class="telemetry">
          <div class="pod">
            <span class="label">DISTANCE</span>
            <div class="pod-val">
              <span id="distance"></span>
            </div>
          </div>
          <div class="pod">
            <span class="label">STEPS</span>
            <div class="pod-val">
              <span id="steps"></span>
            </div>
          </div>
          <div class="pod">
            <span class="label">TIME</span>
            <div class="pod-val">
              <span id="time"></span>
            </div>
          </div>
        </section>

        <!-- Pad Controls -->
        <section class="actions">
          <button id="start" class="pad-btn">
            <i class="ph-bold ph-play"></i>
            <span>START</span>
          </button>
          <button id="pause-resume" class="pad-btn">
            <i id="pause-resume-icon" class="ph-bold ph-pause"></i>
            <span id="pause-resume-label">PAUSE</span>
          </button>
          <button id="stop" class="pad-btn">
            <i class="ph-bold ph-square"></i>
            <span>STOP</span>
          </button>
        </section>

        <!--Overlay item to show the 3.. 2.. 1.. after starting-->
        <div id="countdown-overlay" class="hidden">
          <span id="countdown-count">3</span>
        </div>
      </section>

      <section class="deck history">
        <header class="deck-header">
          <span class="period-label">this week</span>
          <fieldset class="period-switch">
            <label>
              <input type="radio" name="period" value="week" checked />
              <span>week</span>
            </label>
            <label>
              <input type="radio" name="period" value="month" />
              <span>month</span>
            </label>
            <label>
              <input type="radio" name="period" value="year" />
              <span>year</span>
            </label>
            <label>
              <input type="radio" name="period" value="all" />
              <span>all</span>
            </label>
          </fieldset>
        </header>

        <div class="period-steps">
          <span id="period-steps-count"></span>
          <span>steps</span>
        </div>

        <div class="period-overview">
          <div>
            <span class="label">DISTANCE</span>
            <span id="period-distance"></span>
          </div>
          <div>
            <span class="label">TIME</span>
            <span id="period-time"></span>
          </div>
          <div>
            <span class="label">SESSIONS</span>
            <span id="period-sessions"></span>
          </div>
          <div>
            <span class="label">ENERGY</span>
            <span id="period-energy"></span>
          </div>
        </div>

        <div class="last-sessions">
          <span class="label">LAST SESSIONS</span>
          <ul id="last-sessions"></ul>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
